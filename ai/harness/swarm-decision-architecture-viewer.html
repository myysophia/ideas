<style>
:root {
  --bg: #f8f6f3;
  --text: #1a1a1a;
  --text-dim: #6a6a6a;
  --gold: #d4a574;
  --gold-light: #f4e4c1;
  --border: #4a4a4a;
  --shadow: rgba(0,0,0,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem;
}

header {
  text-align: center;
  margin-bottom: 1.5rem;
}

h1 {
  font-family: 'Clash Display', sans-serif;
  font-size: clamp(1.4rem, 3vw, 2rem);
  font-weight: 700;
  color: var(--text);
  margin-bottom: 0.4rem;
}

.subtitle {
  color: var(--text-dim);
  font-size: 0.9rem;
}

.diagram-wrapper {
  position: relative;
  cursor: zoom-in;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 40px var(--shadow), 0 2px 8px var(--shadow);
  border: 1.5px solid rgba(74,74,74,0.2);
  transition: box-shadow 0.3s ease, transform 0.3s ease;
  max-width: 960px;
  width: 100%;
}

.diagram-wrapper:hover {
  box-shadow: 0 16px 60px rgba(0,0,0,0.14), 0 4px 16px var(--shadow);
  transform: translateY(-2px);
}

.diagram-wrapper svg {
  display: block;
  width: 100%;
  height: auto;
}

.hint {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-dim);
  font-size: 0.8rem;
  margin-top: 0.75rem;
}

.hint svg {
  width: 16px;
  height: 16px;
}

/* ── Lightbox ── */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.92);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  backdrop-filter: blur(8px);
  cursor: zoom-out;
}

.lightbox.open {
  display: flex;
  animation: fadeIn 0.2s ease;
}

.lightbox svg {
  max-width: min(95vw, 1400px);
  max-height: 92vh;
  width: auto;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  animation: scaleIn 0.25s cubic-bezier(0.16,1,0.3,1);
}

.close-btn {
  position: fixed;
  top: 1.5rem;
  right: 1.5rem;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  font-size: 1.5rem;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  line-height: 1;
}

.close-btn:hover { background: rgba(255,255,255,0.25); }

.zoom-hint {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 0.8rem;
  pointer-events: none;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}
</style>

<script>
  const wrapper = document.getElementById('diagramWrapper');
  const lightbox = document.getElementById('lightbox');
  const closeBtn = document.getElementById('closeBtn');

  wrapper.addEventListener('click', () => lightbox.classList.add('open'));
  closeBtn.addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) lightbox.classList.remove('open');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') lightbox.classList.remove('open');
  });
</script>
